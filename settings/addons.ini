# Add-ons. All are OFF until Marc approves them.

[daily_report]
# Features 37-39. Turns on by itself when a booking file from today or
# yesterday is saved in the Data folder. Nothing to change here.
max_age_hours = 30

[text_offers]
# Feature 40. Needs a texting service, slot holds and text consent.
# While enabled = no, nothing is ever sent. Messages are only previewed.
enabled = no
provider = none
# Message: clinic name, time, therapist first name and how to reply. Nothing else.
template = Kettle & Stone: an opening {day} at {time} with {therapist}. Reply YES to take it, or NO. First yes gets it.

[second_reminder]
# Feature 41. This is a setting inside Kneadly, not in this program.
# Set to yes after Julie turns on the day-before reminder in Kneadly.
kneadly_reminder_on = no

[kneadly_direct]
# Feature 42 (optional subscription add-on). Needs the higher Kneadly plan.
# Enter the unlock code you receive to switch it on.
unlock_code =
api_key =
account_id =
