# Column names the program expects in each file.
# If Kneadly or the typed waitlist changes a column name, add the new name
# after a comma. Example:  client_name = client_name, Client Name, Name
# The program stops with "export has changed, call Julie" if a column is missing.

[waitlist]
line = line, Line, #, line_no
added = added, Added, date, Date
name = name, Name, client, Client
phone = phone, Phone, number, Number
notes = notes, Notes, note, Note

[appointments]
appointment_id = appointment_id, Appointment ID, id
date = date, Date
start = start, Start, time
length_min = length_min, Length, length, minutes
therapist = therapist, Therapist, practitioner, Practitioner
client_id = client_id, Client ID
client_name = client_name, Client, Client Name, name
booked_at = booked_at, Booked at, created_at, Created
confirmation = confirmation, Confirmation, confirmed
status = status, Status
cancelled_at = cancelled_at, Cancelled at
rebooked_into = rebooked_into, Rebooked into

[openings]
opening_id = opening_id, Opening ID, id
date = date, Date
start = start, Start
length_min = length_min, Length, length
therapist = therapist, Therapist
kind = kind, Kind, type
cancelled_at = cancelled_at, Cancelled at
hours_notice = hours_notice, Hours notice
